<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- This vital line below forces mobile phones to scale the website properly -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evocatis</title>
    <link rel="icon" type="image/jpeg" href="coterie.jpg">
    <!-- Correctly pulling the clean Rethink Sans font style from Google Fonts -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background-image: url('Evocatis.jpg'); 
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat; 
            height: 100vh; 
            width: 100vw;
            position: relative;
            font-family: 'Rethink Sans', sans-serif;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* Desktop Layout (Default settings) */
        .branding-statement {
            position: absolute;
            bottom: 32px;
            left: 32px;
            color: #707C84;
            font-size: 12px;
            letter-spacing: 0.05em;
            user-select: none;
            opacity: 0; /* Hidden on desktop until mouse hover */
            transition: opacity 0.4s ease; 
        }

        .footer-navigation {
            position: absolute;
            bottom: 32px;
            right: 32px;
            display: flex;
            align-items: center;
            gap: 24px;
            opacity: 0; /* Hidden on desktop until mouse hover */
            transition: opacity 0.4s ease; 
        }

        .footer-navigation a {
            color: #707C84;
            text-decoration: none;
            font-size: 12px;
            letter-spacing: 0.05em;
        }

        /* Desktop Hover Interactions */
        body:hover .branding-statement {
            opacity: 1;
        }
        body:hover .footer-navigation {
            opacity: 1;
        }

        /* 📱 Mobile Specific Rules (For screen sizes under 768 pixels wide) */
        @media (max-width: 768px) {
            body {
                /* Ensures the layout doesn't break if mobile address bars pop up */
                height: -webkit-fill-available; 
                overflow: hidden;
            }

            .branding-statement {
                left: 24px;
                bottom: 64px; /* Moves text upward so it clears mobile browser bars */
                opacity: 1;   /* Automatically visible on mobile since you can't hover */
                font-size: 13px; 
            }

            .footer-navigation {
                left: 24px;   /* Aligns links neatly to the left side underneath text */
                right: auto;
                bottom: 32px;
                opacity: 1;   /* Automatically visible on mobile */
                gap: 20px;
            }
            
            .footer-navigation a {
                font-size: 13px;
                padding: 5px 0; /* Makes links slightly larger and easier to tap */
            }
        }
    </style>
</head>
<body>

    <!-- Statement sits cleanly in the bottom left -->
    <div class="branding-statement">
        Pauci sed Potentes.
    </div>

    <!-- Navigation links sit cleanly in the bottom right on desktop, stacks neatly on mobile -->
    <div class="footer-navigation">
        <a href="mailto:coterie@evocat.is">Coterie</a>
        <a href="https://x.com/evocatix" target="_blank">X</a>
    </div>

</body>
</html>
