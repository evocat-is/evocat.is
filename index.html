<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Evocatis</title>
    <link rel="icon" type="image/jpeg" href="coterie.jpg">
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        /* Base page resets */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000; /* Sets canvas background color directly to black */
            font-family: 'Rethink Sans', sans-serif;
            overflow: hidden; /* Stops accidental bouncy page scrolling */
        }

        body { 
            background-image: url('Evocatis.jpg'); 
            background-size: cover; /* Forces image to stretch to cover all white space */
            background-position: center center; /* Keeps the middle part of your image visible */
            background-repeat: no-repeat; 
            position: relative;
            box-sizing: border-box;
        }

        /* 💻 Desktop Rules */
        .branding-statement {
            position: absolute;
            bottom: 32px;
            left: 32px;
            color: #707C84;
            font-size: 12px;
            letter-spacing: 0.05em;
            user-select: none;
            opacity: 0; /* Hidden on desktop until cursor hover */
            transition: opacity 0.4s ease; 
        }

        .footer-navigation {
            position: absolute;
            bottom: 32px;
            right: 32px;
            display: flex;
            align-items: center;
            gap: 24px;
            opacity: 0; /* Hidden on desktop until cursor hover */
            transition: opacity 0.4s ease; 
        }

        .footer-navigation a {
            color: #707C84;
            text-decoration: none;
            font-size: 12px;
            letter-spacing: 0.05em;
        }

        /* Hover interactions for desktop users */
        body:hover .branding-statement,
        body:hover .footer-navigation {
            opacity: 1;
        }

        /* 📱 Mobile Specific Rules (Screens 768px and smaller) */
        @media (max-width: 768px) {
            html, body {
                height: 100vh;
                height: -webkit-fill-available; /* Overrides mobile address bar shifting */
            }

            .branding-statement {
                position: absolute;
                left: 24px;
                bottom: 80px; /* Shift up slightly so it doesn't get covered by browser UI */
                opacity: 1; /* Instantly visible on mobile */
                font-size: 14px; 
            }

            .footer-navigation {
                position: absolute;
                left: 24px;   
                right: 24px;
                bottom: 36px;
                opacity: 1; /* Instantly visible on mobile */
                gap: 24px;
                justify-content: flex-start; /* Neatly stacks along the bottom left */
            }
            
            .footer-navigation a {
                font-size: 14px;
                display: inline-block;
                padding: 8px 0; /* Creates an easier area for mobile fingers to tap */
            }
        }
    </style>
</head>
<body>

    <div class="branding-statement">
        Pauci sed Potentes.
    </div>

    <div class="footer-navigation">
        <a href="mailto:coterie@evocat.is">Coterie</a>
        <a href="https://x.com" target="_blank">X</a>
    </div>

</body>
</html>
